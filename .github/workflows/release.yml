name: Release

# Тег вида v1.2.0 → сборка, подпись и GitHub Release с FurElise.dmg, FurElise.zip и appcast.xml
# (лента автообновления Sparkle). Ручной запуск (Run workflow) → сборка в артефактах без релиза.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SIGNING_P12_BASE64   — base64 от .signing/cert.p12 (подпись тем же сертификатом, что локально)
#   SPARKLE_PRIVATE_KEY  — содержимое .signing/sparkle_private.key (подпись обновлений)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
        run: ./scripts/import-signing.sh

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          ./build.sh

      - name: Appcast
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # Описание обновления — из сообщения аннотированного тега (git tag -a v1.2.0 -m "...").
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > build/notes.txt
          ./scripts/make-appcast.sh "${GITHUB_REF_NAME#v}" build/notes.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FurElise
          path: |
            build/FurElise.dmg
            build/FurElise.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: build/notes.txt
          files: |
            build/FurElise.dmg
            build/FurElise.zip
            build/appcast.xml
